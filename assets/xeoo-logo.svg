<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d11" />
      <stop offset="50%" stop-color="#12131a" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <!-- Glowing Cyber Crimson Gradients -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4365" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadows & Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f43f5e" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Banner Background Card -->
  <rect width="800" height="240" rx="24" fill="url(#bgGrad)" stroke="#22232f" stroke-width="2" />

  <!-- Subtle Cyber Grid / Ambient Glow Lines -->
  <circle cx="130" cy="120" r="90" fill="#f43f5e" opacity="0.08" filter="blur(30px)" />
  <circle cx="700" cy="40" r="110" fill="#8b5cf6" opacity="0.05" filter="blur(40px)" />

  <!-- ==================== XEOO EMBLEM ICON ==================== -->
  <g transform="translate(45, 30)" filter="url(#shadow)">
    <!-- Base Icon Hex Shield Background -->
    <rect x="10" y="10" width="160" height="160" rx="36" fill="#181822" stroke="#2c2d3d" stroke-width="2.5" />

    <!-- Isometric Crystal 'X' Facet 1 (Top Left to Bottom Right) -->
    <path d="M 42 42 L 68 42 L 138 138 L 112 138 Z" fill="url(#crimsonGrad)" filter="url(#neonGlow)" />
    <!-- Isometric Crystal 'X' Facet 2 (Top Right to Bottom Left) -->
    <path d="M 138 42 L 112 42 L 42 138 L 68 138 Z" fill="url(#violetGrad)" opacity="0.95" />

    <!-- Central Fusion Core Diamond -->
    <polygon points="90,75 105,90 90,105 75,90" fill="#ffffff" opacity="0.9" filter="url(#neonGlow)" />
    <!-- Dynamic Accent Dots -->
    <circle cx="48" cy="142" r="4.5" fill="#38bdf8" />
    <circle cx="132" cy="38" r="4.5" fill="#f43f5e" />
  </g>

  <!-- ==================== BRAND TYPOGRAPHY ==================== -->
  <g transform="translate(245, 80)">
    <!-- Main Title "XEOO" -->
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="64" letter-spacing="4" fill="#ffffff">
      XE<tspan fill="url(#crimsonGrad)">OO</tspan>
    </text>

    <!-- Subtitle "THEME SUITE" -->
    <text x="6" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="16" letter-spacing="9" fill="#94a3b8">
      THEME SUITE
    </text>

    <!-- Badge Pills -->
    <g transform="translate(260, 20)">
      <rect x="0" y="0" width="110" height="26" rx="13" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1.2" />
      <text x="55" y="17" font-family="sans-serif" font-weight="700" font-size="11" fill="#fb7185" text-anchor="middle">26 PALETTES</text>
    </g>
    <g transform="translate(380, 20)">
      <rect x="0" y="0" width="125" height="26" rx="13" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1.2" />
      <text x="62" y="17" font-family="sans-serif" font-weight="700" font-size="11" fill="#38bdf8" text-anchor="middle">DARK &amp; LIGHT</text>
    </g>

    <!-- Tagline -->
    <text x="6" y="125" font-family="sans-serif" font-weight="400" font-size="13" fill="#64748b">
      High-Contrast WCAG-Compliant UI/UX &bull; Zero Eye-Strain &bull; Interactive Sidebar Switcher
    </text>
  </g>
</svg>

